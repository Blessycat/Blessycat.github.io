{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

{% if page.translation_url %}
  {% if page.lang == "en" %}
    <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="zh-CN" href="{{ page.translation_url | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.translation_url | absolute_url }}">
  {% else %}
    <link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.translation_url | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
  {% endif %}
{% endif %}
